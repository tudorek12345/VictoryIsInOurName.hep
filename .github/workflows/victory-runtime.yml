name: VIctory runtime integration

on:
  push:
    branches: [main, codex/integrate-victory]
    paths:
      - 'runtimes/victory/**'
      - 'runtime_backend.py'
      - 'run_runtime.cmd'
      - 'tests/test_runtime_backend.py'
      - '.victory-root'
      - '.github/workflows/victory-runtime.yml'
  pull_request:
    paths:
      - 'runtimes/victory/**'
      - 'runtime_backend.py'
      - 'run_runtime.cmd'
      - 'tests/test_runtime_backend.py'
      - '.victory-root'
      - '.github/workflows/victory-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: victory-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-tests:
    name: Native Windows tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Test backend selection and external data paths
        run: python -I tests/test_runtime_backend.py
      - name: Select pinned Rust toolchain
        working-directory: runtimes/victory
        run: rustup show active-toolchain
      - name: Test the runtime without game files
        working-directory: runtimes/victory
        run: cargo test --locked --workspace --no-fail-fast --target x86_64-pc-windows-msvc
      - name: Repeat native shader tests with a parallel harness
        working-directory: runtimes/victory
        shell: pwsh
        run: |
          foreach ($iteration in 1..5) {
            Write-Host "Native shader concurrency regression $iteration/5"
            cargo test --locked -p victory-shader --lib --target x86_64-pc-windows-msvc -- --test-threads=8
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  windows-build:
    name: Native Windows build (${{ matrix.profile }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [release, diag]
    env:
      VICTORY_CI_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Select pinned Rust toolchain
        working-directory: runtimes/victory
        run: rustup show active-toolchain
      - name: Build through the runtime bridge
        shell: pwsh
        run: |
          if ($env:VICTORY_CI_PROFILE -eq 'diag') {
            python -I runtime_backend.py build --diagnostics
          } else {
            python -I runtime_backend.py build
          }
          exit $LASTEXITCODE
      - name: Smoke-test the built CLI
        shell: pwsh
        run: |
          $binary = Join-Path 'runtimes/victory/target/x86_64-pc-windows-msvc' "$env:VICTORY_CI_PROFILE/victory.exe"
          & $binary --help
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: victory-windows-${{ matrix.profile }}
          path: runtimes/victory/target/x86_64-pc-windows-msvc/${{ matrix.profile }}/victory.exe
          if-no-files-found: error
          retention-days: 14
